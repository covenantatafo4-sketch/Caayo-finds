<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>CAAYO — Quality Products, Better Prices</title>
<style>
:root{--bg:#000;--card:#0a0a0a;--line:#2e2e2e;--mut:#a3a3a3;--w:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:#000;color:#fff;font-family:Inter,-apple-system,"SF Pro Display","Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0;padding:0}
svg{display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding:0 16px 70px;position:relative}
.hidden{display:none!important}
/* header */
.top{position:relative;z-index:40;background:#000;padding:calc(4px + env(safe-area-inset-top)) 0 6px;margin:0 -16px;padding-left:16px;padding-right:16px}
.bar{display:grid;grid-template-columns:44px 1fr 44px 44px;align-items:center;height:42px}
.hrow{display:flex;align-items:center;gap:10px;height:46px}
.brand{flex:none;font-size:24px;font-weight:900;letter-spacing:-.03em;line-height:1;cursor:pointer}
.ib{width:40px;height:40px;display:grid;place-items:center;position:relative}
.ib svg{width:24px;height:24px}
.badge{position:absolute;top:2px;right:0;min-width:20px;height:20px;border-radius:20px;background:#fff;color:#000;font-size:12px;font-weight:800;display:grid;place-items:center;padding:0 5px}
.badge:empty,.badge.zero{display:none}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:10px;height:40px;background:#1d1d1d;border-radius:14px;padding:0 12px}
.search svg{width:20px;height:20px;flex:none}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:15px}
.search input::placeholder{color:#bdbdbd}
.search .clr{width:24px;height:24px;border-radius:50%;background:#222;display:none;place-items:center;font-size:16px;line-height:1}
.search.has .clr{display:grid}
/* hero */
.hero{position:relative;margin-top:12px;height:176px;border:1px solid var(--line);border-radius:22px;overflow:hidden;background:#050505}
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s}
.slide.on{opacity:1;visibility:visible}
.slide img{position:absolute;right:0;top:0;height:100%;width:62%;object-fit:cover;object-position:left center}
.slide:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#050505 34%,rgba(5,5,5,.55) 52%,rgba(5,5,5,0) 75%)}
.slide.full img{width:100%;object-position:center}.slide.full:after{display:none}
.slide .txt{position:relative;z-index:2;padding:22px 0 0 20px;max-width:68%}
.eye{font-size:13px;letter-spacing:.06em;color:#c9c9c9;font-weight:500;text-transform:uppercase}
.slide h1{margin:10px 0 6px;font-size:24px;line-height:1.12;font-weight:800;letter-spacing:-.01em}
.slide p{margin:0 0 14px;font-size:15px;color:#e4e4e4}
.pill{display:inline-flex;align-items:center;gap:8px;background:#fff;color:#000;border-radius:999px;padding:10px 18px;font-weight:700;font-size:15px}
.pill svg{width:18px;height:18px}
.dots{position:absolute;left:0;right:0;bottom:12px;z-index:3;display:flex;justify-content:center;gap:10px;padding-left:36%}
.dots i{width:9px;height:9px;border-radius:50%;background:#555;display:block;cursor:pointer}
.dots i.on{background:#fff}
/* categories */
.cats{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 32px)/5);gap:8px;margin-top:14px;overflow-x:auto;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}
.cat{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0}
.cat .box{width:100%;aspect-ratio:1/.87;border:1.5px solid #3a3a3a;border-radius:22px;display:grid;place-items:center;transition:.2s}
.cat .box svg{width:44%;height:auto;aspect-ratio:1;stroke-width:1.5}
.cat:active .box,.cat.on .box{background:#fff;color:#000;border-color:#fff}
.cat span{font-size:11px;text-align:center;white-space:nowrap;letter-spacing:-.03em}
/* sections */
.sec{margin-top:30px}
.sh{display:flex;align-items:flex-start;gap:12px}
.sh>svg{width:32px;height:32px;margin-top:2px;flex:none}
.sh h2{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.sh small{display:block;color:var(--mut);font-size:13.5px;margin-top:5px}
.sh .more{margin-left:auto;display:flex;align-items:center;gap:6px;color:#d4d4d4;font-size:14px;margin-top:6px;white-space:nowrap}
.sh .more svg{width:18px;height:18px}
.row{display:flex;align-items:flex-start;gap:12px;overflow-x:auto;margin:16px -16px 0;padding:0 16px 4px;scroll-snap-type:x proximity;scroll-padding-left:16px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.row .pc{flex:0 0 calc((100% - 68px)/4);scroll-snap-align:start;min-width:84px}.row .pn{font-size:13px;margin-top:8px}.row .rt{font-size:12px;gap:4px}.row .rt svg{width:14px;height:14px}.row .pr{font-size:11px;padding:3px 8px;left:6px;top:6px}.row .pi{border-radius:12px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 8px;margin-top:10px}
.pc{text-align:left;display:block;width:100%}
.pi{position:relative;aspect-ratio:1/.95;border-radius:13px;overflow:hidden;background:#1a1a1a}
.pi img{width:100%;height:100%;object-fit:cover;display:block}
.pr{position:absolute;left:4px;bottom:4px;max-width:calc(100% - 8px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:#000;color:#fff;font-weight:800;font-size:10.5px;border-radius:999px;padding:2px 7px}
.pn{margin-top:4px;font-size:11.5px;line-height:1.18;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rt{display:flex;align-items:center;gap:3px;margin-top:2px;color:#c7c7c7;font-size:10.5px}
.rt svg{width:11px;height:11px;fill:#fff;stroke:none}
.empty{color:var(--mut);text-align:center;padding:48px 10px;grid-column:1/-1;line-height:1.6}
.vt{display:flex;align-items:center;gap:10px;margin-top:20px}
.vt h2{margin:0;font-size:24px;font-weight:800}
.vt .bk{width:40px;height:40px;border:1.5px solid #3a3a3a;border-radius:50%;display:grid;place-items:center}
.vt .bk svg{width:20px;height:20px}
.vt small{color:var(--mut);margin-left:auto}
.chips{display:flex;gap:8px;overflow-x:auto;margin:6px -16px 0;padding:8px 16px;scrollbar-width:none;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:#000}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid #3a3a3a;border-radius:999px;padding:8px 16px;font-size:14px}
.chip.on{background:#fff;color:#000;border-color:#fff;font-weight:700}
.cgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:18px}
.ctile{border:1.5px solid #3a3a3a;border-radius:22px;padding:22px 10px;display:flex;flex-direction:column;align-items:center;gap:12px}
.ctile svg{width:44px;height:44px;stroke-width:1.5}
.ctile b{font-size:16px}.ctile small{color:var(--mut)}
/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#000;border-top:1px solid #1f1f1f}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px 0}
.nav button{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;color:#9a9a9a;position:relative}
.nav button svg{width:23px;height:23px}
.nav button.on{color:#fff;font-weight:600}
.nav button.on svg{fill:#fff}
.nav .badge{top:-4px;right:calc(50% - 22px)}
.home-ind{width:36%;max-width:200px;height:4px;border-radius:5px;background:#fff;margin:4px auto calc(4px + env(safe-area-inset-bottom))}
/* overlays */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:100;opacity:0;visibility:hidden;transition:.25s;display:flex}
.ov.open{opacity:1;visibility:visible}
.ov.right{justify-content:flex-end}.ov.left{justify-content:flex-start}.ov.bottom{align-items:flex-end;justify-content:center}.ov.center{align-items:center;justify-content:center;padding:16px}
.panel{background:#0a0a0a;border:1px solid #2a2a2a;padding:20px;display:flex;flex-direction:column}
.right .panel,.left .panel{width:min(400px,92%);height:100%;transform:translateX(30px);transition:.25s}
.left .panel{transform:translateX(-30px);border-left:0}
.ov.open .panel{transform:none}
.bottom .panel{width:min(560px,100%);max-height:92vh;border-radius:26px 26px 0 0;overflow:auto;transform:translateY(40px);transition:.25s;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.center .panel{width:min(520px,100%);max-height:92vh;overflow:auto;border-radius:24px}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.ph h3{margin:0;font-size:22px}
.x{width:38px;height:38px;border-radius:50%;border:1px solid #333;background:#111;display:grid;place-items:center;font-size:22px;line-height:1}
.mlink{display:flex;align-items:center;gap:14px;padding:15px 4px;border-bottom:1px solid #1c1c1c;font-size:17px;width:100%;text-align:left}
.mlink svg{width:24px;height:24px}
.cl{flex:1;overflow:auto}
.ci{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #1c1c1c}
.ci img{width:64px;height:64px;border-radius:12px;object-fit:cover;background:#222}
.ci b{font-size:15px;font-weight:600;display:block;line-height:1.25}
.qty{display:flex;align-items:center;gap:10px;margin-top:8px}
.qty button{width:28px;height:28px;border-radius:50%;border:1px solid #444;background:#111}
.rm{color:#888;font-size:20px}
.tot{display:flex;justify-content:space-between;font-size:20px;font-weight:800;margin:14px 0}
.btn{width:100%;background:#fff;color:#000;border-radius:14px;padding:15px;font-weight:800;font-size:15px;text-align:center}
.btn.ghost{background:#111;color:#fff;border:1px solid #333}
.btn:disabled{opacity:.6}
.galw{position:relative}.gal{display:flex;gap:0;overflow-x:auto;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none;border-radius:18px;background:#111}.gdots{display:flex;justify-content:center;gap:7px;margin-top:10px}.gdots i{width:7px;height:7px;border-radius:50%;background:#444;display:block}.gdots i.on{background:#fff}.gcount{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.65);color:#fff;font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px}
.gal::-webkit-scrollbar{display:none}
.gal img{flex:0 0 100%;width:100%;scroll-snap-align:center;scroll-snap-stop:always;aspect-ratio:1/1;object-fit:contain;background:#111;-webkit-user-drag:none;user-select:none}.gal::-webkit-scrollbar{display:none}
.pd h3{margin:16px 0 6px;font-size:22px}
.pd .price{font-size:26px;font-weight:900}
.pd p{white-space:pre-line;color:#bdbdbd;line-height:1.55;font-size:15px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.f{display:flex;flex-direction:column;gap:6px}.f.full{grid-column:1/-1}
.f label{font-size:12px;color:#aaa}
.f input,.f textarea{background:#111;border:1px solid #333;border-radius:12px;padding:13px;outline:0;font-size:16px}
.f input:focus,.f textarea:focus{border-color:#fff}
.ord{border:1px solid #262626;border-radius:14px;padding:12px;margin-top:10px;font-size:14px}
.ord small{color:var(--mut)}
.toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,20px);background:#fff;color:#000;padding:12px 18px;border-radius:999px;font-weight:700;font-size:14px;z-index:500;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:360px){.brand{font-size:28px}.slide h1{font-size:22px}.cat span{font-size:11px}.sh h2{font-size:22px}}
/* ---- shop features ---- */
.pc{position:relative}
.pcb{display:block;width:100%;text-align:left}
.hrt{position:absolute;right:4px;top:4px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.62);display:grid;place-items:center;z-index:2}
.hrt svg{width:15px;height:15px;stroke-width:2}
.hrt.on svg{fill:#fff}
.sortbar{display:flex;align-items:center;gap:8px;margin-top:14px}
.sortbar select{background:#111;border:1px solid #333;color:#fff;border-radius:999px;padding:8px 14px;font-size:14px;outline:0}
.sortbar small{color:var(--mut)}
.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:30px}
.trust div{border:1px solid #262626;border-radius:16px;padding:12px 8px;text-align:center;font-size:12px;color:#cfcfcf;line-height:1.35}
.trust b{display:block;color:#fff;font-size:13px;margin-bottom:3px}
.foot{margin:22px 0 8px;text-align:center;color:#8c8c8c;font-size:13px;line-height:2}
.foot a,.foot button{color:#d8d8d8;text-decoration:underline;margin:0 8px;font-size:13px}
.note{background:#111;border:1px solid #2a2a2a;border-radius:14px;padding:12px 14px;font-size:13.5px;color:#cfcfcf;line-height:1.5;margin:6px 0 12px}
.hd{margin:20px 0 4px;font-size:15px;letter-spacing:.02em;text-transform:uppercase;color:#bdbdbd}
.f select{background:#111;border:1px solid #333;border-radius:12px;padding:13px;outline:0;font-size:16px;color:#fff;width:100%}
.areas{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.areas .chip{padding:7px 13px;font-size:13.5px}
.opt{display:flex;gap:12px;align-items:flex-start;border:1.5px solid #333;border-radius:16px;padding:13px;margin-top:10px;width:100%;text-align:left}
.opt.on{border-color:#fff;background:#121212}
.opt i{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid #666;margin-top:2px;position:relative}
.opt.on i{border-color:#fff}.opt.on i:after{content:"";position:absolute;inset:3px;border-radius:50%;background:#fff}
.opt b{display:block;font-size:15px}.opt small{color:#aaa;font-size:12.5px;line-height:1.4;display:block;margin-top:3px}
.opt .pp{margin-left:auto;font-weight:800;white-space:nowrap;font-size:15px}
.sum{margin:16px 0 12px;border-top:1px solid #222;padding-top:10px;font-size:15px}
.sum div{display:flex;justify-content:space-between;padding:5px 0;color:#cfcfcf;gap:12px}
.sum div.t{color:#fff;font-weight:800;font-size:19px;padding-top:10px;margin-top:4px;border-top:1px solid #222}
.sum small{color:#999;font-size:12.5px}
.cust{margin:10px 0 0;font-size:13.5px;color:#cfcfcf;line-height:1.6}
.cust a{color:#fff;text-decoration:underline;font-weight:700}
.dbox{border:1px solid #2a2a2a;border-radius:14px;padding:12px 14px;margin:12px 0;font-size:13.5px;color:#cfcfcf;line-height:1.55}
.dbox b{color:#fff}
.badge2{display:inline-block;font-size:12px;border:1px solid #444;border-radius:999px;padding:3px 10px;margin:0 6px 6px 0;color:#ddd}
.pt{display:flex;align-items:flex-start;gap:10px;margin-top:14px}
.pt h3{margin:0;flex:1}
.pt .x{flex:none}
.pt .x svg{width:20px;height:20px}
.pt .x.on svg{fill:#fff}
.qrow{display:flex;align-items:center;gap:14px;margin:14px 0}
.qrow .qty{margin:0}.qrow .qty button{width:36px;height:36px;font-size:18px}.qrow .qty span{min-width:22px;text-align:center;font-weight:700}
.rel{margin-top:22px}.rel h4{margin:0 0 10px;font-size:16px}
.rel .row{margin:0 -20px;padding:0 20px 4px}
.rel .row .pc{flex:0 0 118px;min-width:118px}
.tl{list-style:none;margin:16px 0 4px;padding:0}
.tl li{position:relative;padding:0 0 18px 34px;color:#777;font-size:15px}
.tl li:before{content:"";position:absolute;left:8px;top:22px;bottom:-2px;width:2px;background:#2a2a2a}
.tl li:last-child:before{display:none}
.tl li i{position:absolute;left:0;top:1px;width:18px;height:18px;border-radius:50%;border:2px solid #444;background:#000}
.tl li.done{color:#fff}.tl li.done i{background:#fff;border-color:#fff}.tl li.done:before{background:#fff}
.tl li.now b{color:#fff}
.tl small{display:block;color:#999;font-size:12.5px;margin-top:2px}
.acc{border-bottom:1px solid #1f1f1f;padding:4px 0}
.acc summary{cursor:pointer;padding:13px 0;font-weight:700;font-size:16px;list-style:none}
.acc summary::-webkit-details-marker{display:none}
.acc summary:after{content:"+";float:right;color:#aaa}.acc[open] summary:after{content:"–"}
.acc p,.acc li{color:#c9c9c9;font-size:14.5px;line-height:1.6;margin:0 0 10px}
.acc ul{margin:0 0 8px;padding-left:20px}
.ok{text-align:center;padding:10px 0}

.ok .tick svg{width:34px;height:34px;stroke-width:3}

.ord{display:flex;align-items:center;gap:10px;justify-content:space-between}
.ord .btn{width:auto;padding:9px 14px;font-size:13px;border-radius:999px}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block;margin-right:7px;border:1px solid #666;vertical-align:-2px}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.opts .chip{padding:8px 14px;font-size:14px}
.oh{margin:14px 0 2px;font-size:14px;color:#bdbdbd}.oh b{color:#fff}
.left .panel{overflow-y:auto}
.mh{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:#888;margin:18px 4px 2px}
.mlink.sub{padding:11px 4px 11px 18px;font-size:15.5px;color:#d8d8d8}
.sh2{display:flex;justify-content:space-between;align-items:center;margin:18px 0 8px;font-size:15px}
.crumb{margin-top:6px;font-size:13px;color:#999}.crumb button{color:#bbb;text-decoration:underline}.crumb b{color:#fff;font-weight:600}
.cp{display:grid;grid-template-columns:108px 1fr;margin-top:12px;min-height:60vh}
.cl2{border-right:1px solid #222}

.cr{padding:2px 0 0 14px;min-width:0}

.sg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}

.cond{position:absolute;left:4px;top:4px;background:#fff;color:#000;font-size:9px;font-weight:800;border-radius:5px;padding:2px 5px}
.shopall{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:10px;border:1.5px solid #3a3a3a;border-radius:14px;padding:12px;font-weight:700;font-size:14.5px}
.shopall svg{width:18px;height:18px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}
.tag{font-size:12px;border:1px solid #555;border-radius:999px;padding:3px 10px;color:#ddd}.tag.c{background:#fff;color:#000;border-color:#fff;font-weight:700}
.revbox{margin-top:26px;border-top:1px solid #222;padding-top:16px}.revbox h4{margin:0 0 10px;font-size:17px}.rvavg{font-weight:500;color:#bbb;font-size:14px;margin-left:6px}
.muted2{color:#888;font-size:14px}
.rv{border-bottom:1px solid #1c1c1c;padding:10px 0}.rvh{display:flex;justify-content:space-between;gap:10px}.rvs{color:#f5c542;letter-spacing:1px}.rvv{font-size:12px;color:#7fd58f;margin:2px 0 4px}.rv p{margin:0;font-size:14.5px;line-height:1.45;color:#e2e2e2}
.rvf{display:none;margin-top:12px}.rvf.open{display:block}

  const liked=sc.filter(x=>x[1]>=.12).sort((a,b)=>b[1]-a[1]).map(x=>x[0]),rest=sc.filter(x=>x[1]<.12).map(x=>x[0]),out=[];

  while(a<liked.length||b<rest.length){
    for(let k=0;k<2&&a<liked.length;k++)out.push(liked[a++]);

/* shipping maths (the server recalculates everything at checkout) */
function lineCalc(){
  const kg={normal:0,special:0};let sub=0;
  for(const k of Object.keys(cart)){const p=byId(pk(k).id);if(!p)continue;const q=cart[k];sub+=price(p,pk(k).variant)*q;kg[p.shippingClass==='special'?'special':'normal']+=(Number(p.weightKg)||0.5)*q}
  return{sub,kg};
}
const expressFor=kg=>Math.ceil(Math.round((kg.normal*CFG.expressPerKg.normal+kg.special*CFG.expressPerKg.special)*CFG.usdRate*100)/100);
function expressOne(p){return Math.ceil(Math.round((Number(p.weightKg)||0.5)*(p.shippingClass==='special'?CFG.expressPerKg.special:CFG.expressPerKg.normal)*CFG.usdRate*100)/100)}

let rvStars=0;
const starRow=n=>'★'.repeat(n)+'☆'.repeat(5-n);
async function loadReviews(pid){
  const box=$('revBox');if(!box)return;
  let d={count:0,avg:0,reviews:[]};
  try{const r=await fetch(API+'/api/reviews/'+encodeURIComponent(pid));if(r.ok)d=await r.json()}catch(e){}
  const p=byId(pid);if(p&&d.count){p.reviewCount=d.count;p.reviewAvg=d.avg}
  const me=ls('caayoAccount',{});rvStars=0;
  box.innerHTML=`<h4>Customer reviews${d.count?` <span class="rvavg">${d.avg.toFixed(1)} ★ · ${d.count}</span>`:''}</h4>
  ${d.reviews.length?d.reviews.map(r=>`<div class="rv"><div class="rvh"><b>${esc(r.name)}</b><span class="rvs">${starRow(r.rating)}</span></div><div class="rvv">Verified buyer · ${new Date(r.date).toLocaleDateString('en-NG',{dateStyle:'medium'})}</div><p>${esc(r.text)}</p></div>`).join(''):'<div class="muted2">No reviews yet.</div>'}
  <button class="btn ghost" style="margin-top:10px" onclick="$('rvForm').classList.toggle('open')">WRITE A REVIEW</button>
  <div class="rvf" id="rvForm"><div class="note" style="margin:0 0 10px">Only customers who ordered this product can review it. Enter the same name and email you used when you ordered.</div>
  <input id="rvName" placeholder="Your name" maxlength="40" autocomplete="name" value="${esc(me.name||'')}"><input id="rvEmail" type="email" placeholder="Email you ordered with" autocomplete="email" value="${esc(me.email||'')}">
  <div class="rvst" id="rvSt">${[1,2,3,4,5].map(n=>`<button type="button" onclick="setRv(${n})" aria-label="${n} stars">★</button>`).join('')}</div>
  <textarea id="rvText" rows="3" maxlength="600" placeholder="How was it? (a few words are fine)"></textarea>
  <button class="btn" onclick="submitReview('${esc(pid)}')">SUBMIT REVIEW</button></div>`;
}
function setRv(n){rvStars=n;document.querySelectorAll('#rvSt button').forEach((b,j)=>b.classList.toggle('on',j<n))}
async function submitReview(pid){
  const name=$('rvName').value.trim(),email=$('rvEmail').value.trim(),text=$('rvText').value.trim();
  if(!name){toast('Enter your name');return}
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){toast('Enter the email you ordered with');return}
  if(!rvStars){toast('Tap the stars to rate');return}
  if(text.length<3){toast('Write a short review');return}
  try{
    const r=await fetch(API+'/api/reviews',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({productId:pid,name,email,rating:rvStars,text})});
    const d=await r.json();
    if(!r.ok){toast(d.error||'Could not save your review');return}
    toast(d.updated?'Your review was updated':'Thanks for your review!');loadReviews(pid);
  }catch(e){toast('Check your connection and try again')}
}

/* cart */
const saveCart=()=>lsSet('caayoCart',cart);
const vkey=(id,color,size,variant)=>[id,color||'',size||'',variant||''].join('::');
const pk=k=>{const[id,color='',size='',variant='']=String(k).split('::');return{id,color,size,variant}};
const kq=k=>encodeURIComponent(k).replace(/'/g,'%27');
const count=()=>Object.values(cart).reduce((a,b)=>a+b,0);
function addToCart(id,n,color,size,variant){const p0=byId(id);if(p0)noteLike(p0.category,p0.name,4);const k=vkey(id,color,size,variant);cart[k]=Math.min(99,(cart[k]||0)+(n||1));saveCart();renderCart();toast('Added to cart')}
function chg(k,d){cart[k]=(cart[k]||0)+d;if(cart[k]<=0)delete cart[k];saveCart();renderCart()}
function renderCart(){
  const n=count();['cb1','cb2'].forEach(i=>{$(i).textContent=n||'';$(i).classList.toggle('zero',!n)});
  let total=0;
  const items=Object.keys(cart).map(k=>{const v=pk(k),p=byId(v.id);if(!p)return '';const q=cart[k];total+=price(p,v.variant)*q;
    const col=(p.colors||[]).find(c=>c.name===v.color),th=(col&&col.image)||imgOf(p),vt=vtext(v.color,v.size,v.variant);
    return `<div class="ci"><img src="${esc(th)}" data-fb="${esc(imgOf(p))}" onerror="cartImgFix(this)" alt=""><div><b>${esc(p.name)}</b>${vt?`<span style="color:#aaa;font-size:12.5px;display:block">${esc(vt)}</span>`:''}<span style="color:#aaa;font-size:13px">${naira(price(p,v.variant))}</span><div class="qty"><button onclick="chg(decodeURIComponent('${kq(k)}'),-1)">−</button><span>${q}</span><button onclick="chg(decodeURIComponent('${kq(k)}'),1)">+</button></div></div><button class="rm" onclick="chg(decodeURIComponent('${kq(k)}'),-99)" aria-label="Remove">×</button></div>`}).join('');
  $('cartList').innerHTML=items||'<div class="empty">Your cart is empty.<br>Find something you love.</div>';
  $('cartTotal').textContent=naira(total);
}
function cartImgFix(el){const fb=el.getAttribute('data-fb');if(fb&&el.getAttribute('src')!==fb){el.setAttribute('src',fb)}else{el.onerror=null;el.style.visibility='hidden'}}
function openCart(){renderCart();openOv('cartOv')}

/* checkout: guest. Door delivery (paid unless the order is big enough) or free pickup. */
const isLocal=s=>CFG.localStates.includes(s);
function doorQuote(sub){
  if(co.type==='pickup')return{fee:0,waived:false,pending:false};
  const local=isLocal(co.state),base=local?CFG.doorFeeLocal:CFG.doorFeeOther;
  if(sub>=CFG.freeThreshold&&(local||CFG.thresholdAllStates))return{fee:0,waived:true,pending:false};
  return{fee:base,waived:false,pending:!!co.state&&!base};
}
function openCheckout(){
  if(!count()){toast('Your cart is empty');return}
  const a=ls('caayoAccount',{});co={type:'door',state:a.state&&NG[a.state]?a.state:'',area:'',method:'standard',pickup:''};
  const local=Object.keys(NG).filter(isLocal),other=Object.keys(NG).filter(s=>!isLocal(s)).sort();
  $('coBody').innerHTML=`<div class="ph"><h3>Checkout</h3><button class="x" onclick="closeAll()">×</button></div>
  <div class="note"><b>No account needed.</b> Enter your email below. We send every update about your order there, from the moment you order until it is delivered.</div>
  <div class="hd">Contact</div>
  <div class="fg">
    <div class="f full"><label>Email (your order updates are sent here)</label><input id="email" type="email" autocomplete="email" value="${esc(a.email||'')}"></div>
    <div class="f"><label>Full name</label><input id="name" autocomplete="name" value="${esc(a.name||'')}"></div>
    <div class="f"><label>Phone</label><input id="phone" type="tel" autocomplete="tel" value="${esc(a.phone||'')}"></div>
  </div>
  <div class="hd">How do you want to receive it?</div>
  <div id="typeBox"></div>
  <div id="doorBox">
    <div class="f full" style="margin-top:12px"><label>State</label><select id="state" onchange="pickState(this.value)"><option value="">Select your state</option>
      <optgroup label="Lagos, Delta, Ondo, Edo">${local.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('')}</optgroup>
      <optgroup label="Other states (additional dispatch fee)">${other.map(s=>`<option value="${esc(s)}">${esc(s)} — + dispatch fee</option>`).join('')}</optgroup></select></div>
    <div id="areaBox"></div>
    <div class="f full" style="margin-top:12px"><label>Delivery address (street, house number, landmark)</label><textarea id="address" rows="2"></textarea></div>
  </div>
  <div id="pickBox" class="hidden"></div>
  <div class="cust">Need delivery to a custom location? Contact us on <a href="tel:${esc(CFG.whatsapp)}">${esc(CFG.whatsapp)}</a> or <a href="https://wa.me/${wa()}" target="_blank" rel="noopener">WhatsApp</a>.</div>
  <div class="hd">Shipping method</div>
  <div id="methodBox"></div>
  <div id="sumBox"></div>
  <button class="btn" id="payBtn" onclick="placeOrder()">PLACE ORDER</button>
  <div class="cust" style="text-align:center;margin-top:10px">Secure payment by Paystack.</div>`;
  if(co.state)$('state').value=co.state;
  renderType();renderAreas();renderMethods();renderSum();openOv('coOv');$('coBody').scrollTop=0;
}
function renderType(){
  const sub=lineCalc().sub,has=CFG.pickupPoints.length>0,q=doorQuote(sub);
  const doorNote=sub>=CFG.freeThreshold?`Free on your order (${naira(CFG.freeThreshold)} and above).`:`Delivered to your address. Free on orders of ${naira(CFG.freeThreshold)} and above.`;
  const doorPrice=co.type==='door'&&co.state?(q.waived?'Free':q.pending?'Fee to confirm':naira(q.fee)):(sub>=CFG.freeThreshold?'Free':'Fee applies');
  $('typeBox').innerHTML=`<button type="button" class="opt ${co.type==='door'?'on':''}" onclick="pickType('door')"><i></i><div><b>Door delivery</b><small>${doorNote}</small></div><span class="pp">${doorPrice}</span></button>
  ${has?`<button type="button" class="opt ${co.type==='pickup'?'on':''}" onclick="pickType('pickup')"><i></i><div><b>Pickup point</b><small>Collect your order yourself at a pickup point.</small></div><span class="pp">Free</span></button>`:''}`;
  $('doorBox').classList.toggle('hidden',co.type==='pickup');
  $('pickBox').classList.toggle('hidden',co.type!=='pickup');
  if(co.type==='pickup')renderPick();
}
function pickType(t){co.type=t;renderType();renderSum()}
function renderPick(){
  $('pickBox').innerHTML=`<div class="f full" style="margin-top:12px"><label>Choose a pickup point</label></div>`+CFG.pickupPoints.map(p=>`<button type="button" class="opt ${co.pickup===p.id?'on':''}" onclick="pickPoint('${esc(p.id)}')"><i></i><div><b>${esc(p.name)}</b><small>${esc([p.address,p.area,p.state].filter(Boolean).join(', '))}</small></div></button>`).join('');
}
function pickPoint(id){co.pickup=id;renderPick();renderSum()}
function pickState(s){co.state=s;co.area='';renderAreas();renderType();renderSum()}
function renderAreas(){
  const b=$('areaBox');if(!co.state){b.innerHTML='';return}
  const local=isLocal(co.state),areas=NG[co.state]||[],f=local?CFG.doorFeeLocal:CFG.doorFeeOther;
  const fee=f>0?`door delivery costs <b>${naira(f)}</b>`:`an additional dispatch fee applies, and we will confirm the amount with you`;
  const free=(local||CFG.thresholdAllStates)?` Free on orders of ${naira(CFG.freeThreshold)} and above.`:'';
  b.innerHTML=`<div class="dbox" style="margin-top:12px">For <b>${esc(co.state)}</b>, ${fee}.${free}</div>
  <div class="f full"><label>Popular areas in ${esc(co.state)}</label></div>
  <div class="areas">${areas.map((a,i)=>`<button type="button" class="chip ${co.area===a?'on':''}" onclick="pickArea(${i})">${esc(a)}</button>`).join('')}<button type="button" class="chip ${co.area==='__other'?'on':''}" onclick="pickArea(-1)">Other area</button></div>
  ${co.area==='__other'?'<div class="f full" style="margin-top:8px"><label>Your area / town</label><input id="areaOther" placeholder="Type your area"></div>':''}`;
}
function pickArea(i){co.area=i<0?'__other':NG[co.state][i];renderAreas();renderSum()}
function quote(){
  const {sub,kg}=lineCalc(),exp=co.method==='express'?expressFor(kg):0,d=doorQuote(sub);
  return{sub,kg,exp,disp:d.fee,waived:d.waived,pending:d.pending,total:sub+exp+d.fee};
}
function renderMethods(){
  const {kg}=lineCalc(),e=expressFor(kg);
  $('methodBox').innerHTML=`<button type="button" class="opt ${co.method==='standard'?'on':''}" onclick="pickMethod('standard')"><i></i><div><b>Standard shipping</b><small>Arrives in 2 to 3 months</small></div><span class="pp">Free</span></button>
  <button type="button" class="opt ${co.method==='express'?'on':''}" onclick="pickMethod('express')"><i></i><div><b>Express shipping</b><small>Arrives in 7 to 10 days. $${CFG.expressPerKg.normal}/kg for normal items, $${CFG.expressPerKg.special}/kg for special and battery items (charged in naira).</small></div><span class="pp">${naira(e)}</span></button>`;
}
function pickMethod(m){co.method=m;renderMethods();renderSum()}
function renderSum(){
  const q=quote(),pk=co.type==='pickup',need=CFG.freeThreshold-q.sub;
  const disp=pk?'Free (pickup)':!co.state?'Choose state':q.waived?'Free':q.pending?'To be confirmed':naira(q.disp);
  $('sumBox').innerHTML=`<div class="sum"><div><span>Items</span><span>${naira(q.sub)}</span></div>
  <div><span>${co.method==='express'?'Express shipping ('+(q.kg.normal+q.kg.special).toFixed(2)+' kg)':'Standard shipping'}</span><span>${co.method==='express'?naira(q.exp):'Free'}</span></div>
  <div><span>${pk?'Pickup':'Door delivery'+(co.state?' ('+esc(co.state)+')':'')}</span><span>${disp}</span></div>
  <div class="t"><span>Total</span><span>${naira(q.total)}</span></div>
  ${!pk&&q.pending?'<small>The door delivery fee for your state is not included yet. We will contact you with the amount.</small>':''}
  ${!pk&&!q.waived&&need>0&&(isLocal(co.state)||CFG.thresholdAllStates||!co.state)?`<small>Add ${naira(need)} more to get free door delivery, or choose free pickup.</small>`:''}
  <small>${co.method==='express'?'Estimated delivery: 7 to 10 days after you order.':'Estimated delivery: 2 to 3 months after you order.'}</small></div>`;
  renderType();
  const b=$('payBtn');if(b)b.textContent='PAY '+naira(q.total);
}
async function placeOrder(){
  const email=$('email').value.trim(),name=$('name').value.trim(),phone=$('phone').value.trim();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){toast('Enter a valid email');$('email').focus();return}
  if(!name||!phone){toast('Enter your name and phone');return}
  const items=Object.entries(cart).filter(([,q])=>q>0).map(([k,quantity])=>{const v=pk(k);return{id:v.id,quantity,color:v.color,size:v.size,variant:v.variant}});
  let payload={email,items,shippingMethod:co.method,deliveryType:co.type},state='';
  if(co.type==='pickup'){
    if(!co.pickup){toast('Choose a pickup point');return}
    payload.pickupId=co.pickup;payload.customer={name,phone};
  }else{
    if(!co.state){toast('Choose your state');$('state').focus();return}
    const area=co.area==='__other'?($('areaOther')?$('areaOther').value.trim():''):co.area,address=$('address').value.trim();
    if(!area){toast('Choose your area');return}
    if(!address){toast('Enter your delivery address');$('address').focus();return}
    payload.customer={name,phone,state:co.state,city:area,address};state=co.state;
  }
  const btn=$('payBtn');btn.disabled=true;btn.textContent='PLEASE WAIT…';
  try{
    const r=await fetch(API+'/api/orders',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});
    const d=await r.json();if(!r.ok)throw new Error(d.error||'Could not create order');
    lsSet('caayoAccount',{name,phone,email,state});
    const log=ls('caayoOrders',[]);
    log.unshift({id:d.orderId,total:d.total,count:items.reduce((s,i)=>s+i.quantity,0),date:new Date().toISOString(),email,paid:false,method:co.method,type:co.type});
    lsSet('caayoOrders',log.slice(0,30));
    if(d.paymentUrl){location.href=d.paymentUrl;return}
    cart={};saveCart();renderCart();showSuccess(d.orderId,email,co.method,co.type);
  }catch(e){toast(e.message||'Order failed');btn.disabled=false;renderSum()}
}
function showSuccess(id,email,method,type){
  const pk=type==='pickup';
  $('okBody').innerHTML=`<div class="ok"><div class="tick">${ico('<path d="M5 12.5l4.5 4.5L19 7.5"/>')}</div><h3>Thank you for your order</h3>
  <p>Your order number is<br><code>${esc(id)}</code></p>
  <p>We will email every update to <b>${esc(email)}</b>: packaged, loaded on the ship, left the port, arrived in Nigeria, and ${pk?'ready for pickup':'delivered'}.</p>
  <p>Estimated ${pk?'arrival':'delivery'}: <b>${method==='express'?'7 to 10 days':'2 to 3 months'}</b>.</p>
  <button class="btn" style="margin-top:14px" onclick="openTrack('${esc(id)}','${esc(email)}')">TRACK THIS ORDER</button>
  <button class="btn ghost" style="margin-top:10px" onclick="go('home')">CONTINUE SHOPPING</button></div>`;
  openOv('okOv');
}

/* tracking (order ID + email, no account) */
function openTrack(id,email){
  const a=ls('caayoAccount',{}),last=ls('caayoOrders',[])[0]||{};
  $('tId').value=id||last.id||'';$('tEmail').value=email||last.email||a.email||'';$('tOut').innerHTML='';
  openOv('trOv');
  if(id&&email)doTrack();
}
async function doTrack(){
  const id=$('tId').value.trim(),email=$('tEmail').value.trim(),out=$('tOut'),btn=$('tBtn');
  if(!id||!email){toast('Enter your order ID and email');return}
  btn.disabled=true;btn.textContent='CHECKING…';
  try{
    const r=await fetch(API+'/api/track?id='+encodeURIComponent(id)+'&email='+encodeURIComponent(email));const d=await r.json();
    if(!r.ok)throw new Error(d.error||'Not found');
    const o=d.order,stages=o.stages,cur=stages.findIndex(s=>s.key===o.stage),when={};
    (o.timeline||[]).forEach(t=>when[t.stage]=t.at);
    out.innerHTML=`<div class="dbox"><b>${esc(o.id)}</b><br>${o.lines.map(l=>esc(l.name)+(l.color||l.size||l.variant?' ('+esc(vtext(l.color,l.size,l.variant))+')':'')+' × '+l.quantity).join(', ')}<br>${o.delivery&&o.delivery.type==='pickup'?'Pickup at '+esc(o.delivery.pointName||'')+' · ':'Delivering to '+esc([o.area,o.state].filter(Boolean).join(', '))+' · '}${o.method==='express'?'Express':'Standard'} shipping${o.eta&&o.eta.text?'<br>Estimated arrival: <b>'+esc(o.eta.text)+'</b>':''}</div>
    ${o.status!=='paid'&&cur<0?'<div class="note">We are waiting for payment confirmation. If you have paid, check again in a few minutes.</div>':''}
    <ul class="tl">${stages.map((s,i)=>`<li class="${i<=cur?'done':''} ${i===cur?'now':''}"><i></i><b>${esc(s.label)}</b>${when[s.key]?'<small>'+new Date(when[s.key]).toLocaleString('en-NG',{dateStyle:'medium',timeStyle:'short'})+'</small>':''}</li>`).join('')}</ul>`;
  }catch(e){out.innerHTML=`<div class="note">${esc(e.message)}</div>`}
  finally{btn.disabled=false;btn.textContent='TRACK'}
}

/* account: no login, details and orders are kept on this device */
function openAccount(){
  const a=ls('caayoAccount',{});
  $('aName').value=a.name||'';$('aPhone').value=a.phone||'';$('aEmail').value=a.email||'';
  const log=ls('caayoOrders',[]);
  $('orderList').innerHTML=log.map(o=>`<div class="note ord"><div><b>${esc(o.id)}</b><br><small>${new Date(o.date).toLocaleDateString('en-NG')} · ${o.count} item${o.count===1?'':'s'} · ${naira(o.total)} · ${o.paid?'Paid':'Pending'}</small></div><button class="btn ghost" onclick="openTrack('${esc(o.id)}','${esc(o.email||a.email||'')}')">Track</button></div>`).join('')||'<div class="empty" style="padding:24px 0">No orders yet.</div>';
  openOv('acctOv');
}
function saveAccount(){const a=ls('caayoAccount',{});lsSet('caayoAccount',{...a,name:$('aName').value.trim(),phone:$('aPhone').value.trim(),email:$('aEmail').value.trim()});toast('Details saved');closeAll()}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(window._t);window._t=setTimeout(()=>t.classList.remove('show'),2200)}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAll()});

/* coming back from Paystack */
async function checkPayment(){
  const q=new URLSearchParams(location.search),ref=q.get('reference')||q.get('trxref');
  if(!ref)return;
  history.replaceState(null,'',location.pathname);
  try{
    const r=await fetch(API+'/api/paystack/verify/'+encodeURIComponent(ref)),d=await r.json();
    if(d.paid){
      cart={};saveCart();renderCart();
      const log=ls('caayoOrders',[]),hit=log.find(o=>o.id===d.orderId);
      if(hit)hit.paid=true;else log.unshift({id:d.orderId,total:d.total,count:d.count,date:new Date().toISOString(),paid:true});
      lsSet('caayoOrders',log);
      showSuccess(d.orderId,(hit&&hit.email)||d.email||'your email',(hit&&hit.method)||'standard',(hit&&hit.type)||'door');
    }else toast('Payment not completed. Your cart is saved.');
  }catch(e){toast('Could not confirm payment yet. Check My Orders later.')}
}
function deepLinks(){const q=new URLSearchParams(location.search);if(q.get('track')){const id=q.get('track');history.replaceState(null,'',location.pathname);openTrack(id)}}
products=DEMO;render();renderCart();loadConfig();loadProducts();checkPayment();deepLinks();
